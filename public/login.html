<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ingresar - El Gringo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
    <h1 class="text-xl font-bold text-slate-900">El Gringo</h1>
    <p class="text-xs font-medium text-emerald-600 tracking-wide uppercase mb-5">Acceso del personal</p>

    <div class="space-y-3">
      <input id="usuario" type="text" autocomplete="username" placeholder="Usuario"
        class="w-full border border-slate-200 rounded-2xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
      <input id="clave" type="password" autocomplete="current-password" placeholder="Contraseña"
        class="w-full border border-slate-200 rounded-2xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
      <p id="error" class="text-xs text-rose-600 font-medium min-h-[1rem]"></p>
      <button id="entrar" class="w-full bg-emerald-600 active:bg-emerald-700 text-white font-semibold py-3 rounded-2xl">
        Ingresar
      </button>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);

  async function ingresar() {
    $('error').textContent = '';
    $('entrar').disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario: $('usuario').value.trim(), clave: $('clave').value })
      });
      const datos = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(datos.error || 'Error ' + r.status);
      location.href = datos.rol === 'vendedor' ? '/vendedor/' : '/admin/';
    } catch (e) {
      $('error').textContent = e.message;
      $('entrar').disabled = false;
    }
  }

  $('entrar').addEventListener('click', ingresar);
  $('clave').addEventListener('keydown', e => { if (e.key === 'Enter') ingresar(); });
</script>
</body>
</html>
