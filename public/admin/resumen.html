<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Resumen - El Gringo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/styles.css">
<style>
  .campo { width:100%; background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:.6rem .75rem; font-size:.875rem; }
  .campo:focus { outline:none; border-color:#10b981; }
</style>
</head>
<body class="min-h-screen pb-10">

<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 py-4">
  <div class="max-w-md mx-auto">
    <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-tight">Resumen</h1>
    <p class="text-xs font-medium text-emerald-600 tracking-wide uppercase">El Gringo despensa</p>
  </div>
</header>

<nav class="max-w-md mx-auto px-4 pt-3 flex gap-2 text-xs font-semibold overflow-x-auto no-scrollbar">
  <a href="/admin/" class="px-3.5 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600">Productos</a>
  <a href="/vendedor/" class="px-3.5 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600">Pedidos</a>
  <a href="/admin/resumen.html" class="px-3.5 py-1.5 rounded-full bg-emerald-600 text-white">Resumen</a>
  <a href="/admin/horarios.html" class="px-3.5 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600">Horarios</a>
  <button onclick="salir()" class="px-3.5 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600">Salir</button>
</nav>

<main class="max-w-md mx-auto px-4 pt-4">
  <div id="periodos" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-1"></div>
  <p id="rango" class="text-[11px] text-slate-400 mb-3"></p>

  <div id="tarjetas" class="grid grid-cols-2 gap-3 mb-4"></div>

  <div class="bg-white rounded-2xl border border-slate-100 p-4 mb-4">
    <label class="text-[11px] font-semibold text-slate-500">Comisión acordada (%)</label>
    <div class="flex items-center gap-4 mt-1">
      <input id="comision" type="text" inputmode="decimal" placeholder="0" oninput="calcularComision()" class="campo" style="max-width:6rem">
      <div>
        <p class="text-[11px] text-slate-400">Tu comisión sobre lo pagado</p>
        <p id="comision-monto" class="text-xl font-bold text-emerald-600">$0</p>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-between mb-2">
    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Productos</h2>
    <select id="base" onchange="cambiarBase(this.value)" class="campo" style="width:auto;padding:.35rem .6rem;font-size:.75rem">
      <option value="pagados">Solo pagados</option>
      <option value="vigentes">Pagados + pendientes</option>
    </select>
  </div>
  <div id="productos" class="bg-white rounded-2xl border border-slate-100 divide-y divide-slate-100 mb-4"></div>

  <div class="grid grid-cols-2 gap-2">
    <button onclick="csvComprobantes()" class="bg-white border border-slate-200 text-slate-700 text-xs font-semibold py-3 rounded-2xl">
      <i class="fa-solid fa-download mr-1"></i>Comprobantes (CSV)
    </button>
    <button onclick="csvProductos()" class="bg-white border border-slate-200 text-slate-700 text-xs font-semibold py-3 rounded-2xl">
      <i class="fa-solid fa-download mr-1"></i>Productos (CSV)
    </button>
  </div>
</main>

<div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300"></div>

<script src="/admin/resumen.js"></script>
</body>
</html>
