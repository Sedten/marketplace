<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pedidos - El Gringo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/styles.css">
<style>
  .campo { width:100%; background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:.6rem .75rem; font-size:.875rem; }
  .campo:focus { outline:none; border-color:#10b981; }
</style>
</head>
<body class="min-h-screen pb-10">

<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 py-3">
  <div class="max-w-md mx-auto flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-tight">Pedidos</h1>
      <p id="rol" class="text-xs font-medium text-emerald-600 tracking-wide uppercase">El Gringo despensa</p>
    </div>
    <div class="flex items-center gap-2">
      <a id="link-admin" href="/admin/" style="display:none" class="text-xs font-semibold text-slate-600 bg-slate-100 px-3 py-2 rounded-full">Admin</a>
      <button onclick="cargar(true)" aria-label="Actualizar" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
        <i class="fa-solid fa-rotate text-sm"></i>
      </button>
      <button onclick="salir()" class="text-xs font-semibold text-slate-600 bg-slate-100 px-3 py-2 rounded-full">Salir</button>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-4">
  <div class="flex gap-2 mb-3">
    <div class="relative flex-1">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      <input id="buscar" type="search" placeholder="Pegar comprobante (GRN-0001-ABC)" oninput="buscar(this.value)"
        class="campo" style="padding-left:2.2rem" autocomplete="off" autocapitalize="characters">
    </div>
    <button onclick="pegar()" class="shrink-0 bg-emerald-600 active:bg-emerald-700 text-white text-sm font-semibold px-4 rounded-2xl">
      <i class="fa-solid fa-paste mr-1"></i>Pegar
    </button>
  </div>

  <div id="tabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-2"></div>

  <div class="flex items-center gap-2 mb-2">
    <i class="fa-solid fa-arrow-down-wide-short text-slate-400 text-sm"></i>
    <select id="orden" onchange="cambiarOrden(this.value)" class="campo" style="padding:.5rem .75rem">
      <option value="recientes">Más recientes primero</option>
      <option value="antiguos">Más antiguos primero</option>
      <option value="mayor">Mayor total primero</option>
      <option value="menor">Menor total primero</option>
    </select>
  </div>

  <p id="resumen" class="text-xs text-slate-400 font-medium mb-3"></p>
  <div id="lista" class="space-y-2"></div>
</main>

<div id="detalle" style="display:none" onclick="if(event.target===this)cerrar()"
  class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm items-end justify-center">
  <div class="bg-white w-full max-w-md rounded-t-3xl p-5 max-h-[92vh] overflow-y-auto">
    <div class="flex justify-end -mb-2">
      <button onclick="cerrar()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
    <div id="detalle-contenido"></div>
  </div>
</div>

<div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300"></div>

<script src="/vendedor/vendedor.js"></script>
</body>
</html>
