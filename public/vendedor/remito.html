<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Remito - El Gringo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/styles.css">
<style>
  .campo { width:100%; background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:.6rem .75rem; font-size:.875rem; }
  .campo:focus { outline:none; border-color:#10b981; }
  label.et { display:block; font-size:.7rem; font-weight:600; color:#64748b; margin-bottom:.25rem; }
  @media print {
    .no-imprimir { display: none !important; }
    body { background: #fff !important; padding: 0 !important; }
    main { padding: 0 !important; max-width: none !important; }
    #vista { width: 80mm !important; max-width: none !important; box-shadow: none !important; border-radius: 0 !important; }
    @page { size: 80mm auto; margin: 0; }
  }
</style>
</head>
<body class="min-h-screen pb-10">

<header class="no-imprimir sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 py-3">
  <div class="max-w-md mx-auto flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-tight">Remito</h1>
      <p id="codigo" class="text-xs font-mono font-medium text-emerald-600"></p>
    </div>
    <a href="/vendedor/" class="text-xs font-semibold text-slate-600 bg-slate-100 px-3 py-2 rounded-full">
      <i class="fa-solid fa-arrow-left mr-1"></i>Volver
    </a>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-4">
  <div class="no-imprimir space-y-3 mb-4">
    <div>
      <label class="et" for="cliente">Nombre del cliente</label>
      <input id="cliente" type="text" class="campo" maxlength="60" autocomplete="off">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="et" for="unidad">Pabellón / casa</label>
        <input id="unidad" type="text" class="campo" maxlength="30" autocomplete="off">
      </div>
      <div>
        <label class="et" for="remito">N° remito proveedor</label>
        <input id="remito" type="text" class="campo" maxlength="30" autocomplete="off">
      </div>
    </div>
    <div>
      <label class="et" for="nota">Nota (opcional)</label>
      <input id="nota" type="text" class="campo" maxlength="80" autocomplete="off">
    </div>
    <p class="text-[11px] text-slate-400">Estos datos no se guardan: solo se usan para armar el remito.</p>
  </div>

  <div class="flex justify-center">
    <img id="vista" alt="Remito" class="w-full max-w-[320px] bg-white shadow rounded">
  </div>

  <div class="no-imprimir grid grid-cols-3 gap-2 mt-4">
    <button onclick="compartirImagen()" class="bg-emerald-600 active:bg-emerald-700 text-white text-xs font-semibold py-3 rounded-2xl">
      <i class="fa-solid fa-share-nodes mr-1"></i>Compartir
    </button>
    <button onclick="descargarImagen()" class="bg-white border border-slate-200 text-slate-700 text-xs font-semibold py-3 rounded-2xl">
      <i class="fa-solid fa-image mr-1"></i>Imagen
    </button>
    <button onclick="window.print()" class="bg-white border border-slate-200 text-slate-700 text-xs font-semibold py-3 rounded-2xl">
      <i class="fa-solid fa-print mr-1"></i>Imprimir / PDF
    </button>
  </div>
</main>

<div id="toast" class="no-imprimir fixed top-20 left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300"></div>

<script src="/vendedor/remito.js"></script>
</body>
</html>
